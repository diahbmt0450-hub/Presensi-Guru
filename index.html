<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Presensi Guru</title>
  <meta name="description" content="Halaman masuk sistem presensi guru sekolah. Login untuk mengakses data kehadiran dan laporan presensi." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/login.css" />
</head>
<body>

  <!-- Background -->
  <div class="bg-wrapper">
    <img src="assets/img/bg-login.jpg" alt="Background Sekolah" class="bg-image" />
    <div class="bg-overlay"></div>
    <!-- Floating particles -->
    <div class="particles">
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>
  </div>

  <!-- Main Container -->
  <main class="main-container">


    <!-- Right Panel - Login Form -->
    <section class="form-panel" aria-label="Form Login">
      <div class="form-card">

        <!-- Card Header -->
        <div class="card-header">
          <div class="logo-circle">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <h2 class="card-title">Selamat <span class="title-accent">Datang!</span></h2>
          <p class="card-subtitle">Masuk ke akun Anda untuk mengelola presensi guru</p>
        </div>

        <!-- Alert Box -->
        <div class="alert-box" id="alertBox" role="alert" aria-live="polite">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span id="alertMsg"></span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="login-form" novalidate>

          <!-- Username Field -->
          <div class="form-group" id="groupUsername">
            <label class="form-label" for="username">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              Username / NIP
            </label>
            <div class="input-wrapper">
              <input
                type="text"
                id="username"
                name="username"
                class="form-input"
                placeholder="Masukkan username atau NIP"
                autocomplete="username"
                required
              />
              <div class="input-focus-ring"></div>
            </div>
            <span class="field-error" id="usernameError"></span>
          </div>

          <!-- Password Field -->
          <div class="form-group" id="groupPassword">
            <label class="form-label" for="password">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              Password
            </label>
            <div class="input-wrapper">
              <input
                type="password"
                id="password"
                name="password"
                class="form-input"
                placeholder="Masukkan password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="toggle-password" id="togglePwd" aria-label="Tampilkan/sembunyikan password">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eyeOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
              <div class="input-focus-ring"></div>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <!-- Remember & Forgot -->
          <div class="form-options">
            <label class="remember-label" for="remember">
              <input type="checkbox" id="remember" name="remember" class="remember-checkbox" />
              <span class="custom-checkbox">
                <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="1,6 4,9 11,2"/>
                </svg>
              </span>
              Ingat saya
            </label>
            <a href="#" class="forgot-link" id="forgotLink">Lupa password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-login" id="btnLogin">
            <span class="btn-text">Masuk</span>
            <span class="btn-loader" id="btnLoader" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
              </svg>
            </span>
            <svg class="btn-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12,5 19,12 12,19"/>
            </svg>
          </button>

        </form>

        <!-- Divider -->
        <div class="divider">
          <span>Atau</span>
        </div>

        <!-- Google Sign-in Style Button -->
        <button type="button" class="btn-google" id="btnGoogle">
          <!-- Google "G" icon -->
          <svg width="20" height="20" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21c10.5 0 20-7.6 20-21 0-1.4-.1-2.7-.5-4z" fill="#FFC107"/>
            <path d="M6.3 14.7l7 5.1C15.1 16 19.2 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6-6C34.6 5.1 29.6 3 24 3c-7.7 0-14.4 4.4-17.7 11.7z" fill="#FF3D00"/>
            <path d="M24 45c5.5 0 10.5-1.9 14.4-5.1l-6.7-5.5C29.5 36.1 26.9 37 24 37c-6 0-10.6-3.9-11.8-9.2l-7 5.4C8.4 40.5 15.6 45 24 45z" fill="#4CAF50"/>
            <path d="M44.5 20H24v8.5h11.8c-.8 2.6-2.6 4.8-4.9 6.3l6.7 5.5C41.7 37.2 45 31 45 24c0-1.4-.1-2.7-.5-4z" fill="#1976D2"/>
          </svg>
          Masuk dengan Google
        </button>

        <!-- Sign up text -->
        <p class="signup-text">
          Belum punya akun? <a href="register.html" class="signup-link" id="signupLink">Daftar</a>
        </p>

        <!-- Footer -->
        <p class="card-footer">
          &copy; 2026 Sistem Presensi Guru &mdash; Diah Safitri
        </p>

      </div>
    </section>

  </main>

  <script src="assets/js/login.js"></script>
</body>
</html>
